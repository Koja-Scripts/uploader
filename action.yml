name: 'CFX Portal Upload'
description:
  'Uploads assets to CFX Portal with support for escrowed and open source
  versions'
author: 'KOJA'

branding:
  icon: 'upload-cloud'
  color: 'gray-dark'

inputs:
  cookie:
    description: 'Your Forum Account Cookie (_t cookie from forum.cfx.re)'
    required: true
  chunkSize:
    description:
      'Upload chunk size in bytes (default: 2MB, recommended: 5-20MB for large
      files)'
    required: false
    default: 2097152
  maxRetries:
    description: 'Maximum number of login retries'
    required: false
    default: 3
  skipUpload:
    description: 'Skip upload and only test authentication'
    required: false
    default: false
  # Simple single asset upload
  assetId:
    description: 'Asset ID for simple single upload'
    required: false
  assetName:
    description: 'Asset name for simple single upload (will lookup ID)'
    required: false
  makeZip:
    description: 'Automatically create ZIP from repository'
    required: false
    default: true
  zipPath:
    description: 'Path to pre-made ZIP file'
    required: false
  # Script versions (escrowed + open source)
  escrowed:
    description:
      'Escrowed version config (YAML: asset_id, asset_name, escrow_ignore)'
    required: false
  openSource:
    description: 'Open source version config (YAML: asset_id, asset_name)'
    required: false
  # Asset versions (HQ + LQ from different branches)
  hq:
    description:
      'High quality version config (YAML: asset_id, asset_name, branch)'
    required: false
  lq:
    description:
      'Low quality version config (YAML: asset_id, asset_name, branch)'
    required: false
  author:
    description:
      'Author written into fxmanifest.lua of the built packs (e.g. Hexel)'
    required: false
    default: 'Koja Scripts'
  # Hexel store (scripts also sold on hexelstore.com)
  hexel:
    description:
      'Hexel store config (YAML: product, category, author). Builds the
      open-source pack and publishes it with the changelog as a download on that
      Hexel product. Release candidates are skipped.'
    required: false
    default: ''
  hexelSecret:
    description:
      'Hexel store API secret (PROJECT_API_SECRET), e.g.
      secrets.HEXEL_API_SECRET'
    required: false
    default: ''
  # Portal asset versioning
  version:
    description:
      'Version number shown on the portal (default: the release tag; non-tag
      runs upload "<fxmanifest version>-dev.<sha>" as a release candidate)'
    required: false
    default: ''
  changelog:
    description: 'Changelog for the version (default: the GitHub release body)'
    required: false
    default: ''
  releaseCandidate:
    description:
      'Mark the version as a release candidate: true/false (default: true for
      GitHub pre-releases)'
    required: false
    default: ''
  keepVersions:
    description:
      'How many versions to keep per asset (1-5). The portal allows 5; the
      oldest is always removed to make room for a new upload.'
    required: false
    default: 5
  processingTimeout:
    description:
      'Seconds to wait for the portal to process the upload (0 disables). A
      failed processing fails the run; a timeout only warns.'
    required: false
    default: 120
  webhookUrl:
    description:
      'Release-notification endpoint (pass an org/repo secret, e.g.
      WEBHOOK_URL). Leave empty to disable notifications.'
    required: false
    default: ''

runs:
  using: node24
  main: dist/index.js
